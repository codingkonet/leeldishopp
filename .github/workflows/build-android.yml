name: Build LebeldiShop Android APK

on:
  workflow_dispatch:
    inputs:
      store_url:
        description: "Public PHP website URL"
        required: true
        default: "https://lebeldishop.com/"
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug -PSTORE_URL="${{ inputs.store_url }}" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lebeldishop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
